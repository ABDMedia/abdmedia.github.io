<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABDMedia</title>
<meta name="description" content="ABDMedia – simple, private Android apps.">
<style>
  :root { --bg:#ffffff; --fg:#1b1f24; --muted:#5b6470; --accent:#0a66e8; --card:#f3f6fa; --line:#e2e7ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1318; --fg:#e8ecf1; --muted:#9aa4b1; --accent:#5aa2ff; --card:#18202a; --line:#26303c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 20px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  p.lead { color:var(--muted); margin:0 0 32px; }
  .app { display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 20px; }
  .logo { width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,#01ea9e,#019fe3 50%,#005bfe); flex:none; }
  .app h2 { margin:0; font-size:1.1rem; }
  .app p { margin:2px 0 0; color:var(--muted); font-size:.95rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>ABDMedia</h1>
  <p class="lead">Simple, private Android apps.</p>
  <div class="app">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h2>All-in-One QR Scanner &amp; Maker</h2>
      <p>Scan and create QR codes and barcodes, fully offline.</p>
      <p><a href="qrscanner/privacy/">Privacy policy</a></p>
    </div>
  </div>
</main>
</body>
</html>
